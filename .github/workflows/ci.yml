---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"

defaults:
  run:
    working-directory: "pavelpikta.torrserver"

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6
        with:
          path: "pavelpikta.torrserver"

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies.
        run: pip3 install yamllint

      - name: Lint code.
        run: |
          yamllint .

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - rockylinux10
          - ubuntu2404
          - debian13

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6
        with:
          path: "pavelpikta.torrserver"

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies.
        run: pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Run Molecule tests.
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
