---
- name: config | Resolve TorrServer version capabilities
  ansible.builtin.include_tasks:
    file: version.yml
    apply:
      tags:
        - torrserver
        - config
        - version
        - daemon_config
        - settings
  tags:
    - torrserver
    - config
    - version
    - daemon_config
    - settings

- name: config | Create configuration file
  ansible.builtin.template:
    src: torrserver.config.j2
    dest: "{{ torrserver_install_dir }}/{{ torrserver_service_name }}.config"
    owner: "{{ torrserver_user }}"
    group: "{{ torrserver_group }}"
    mode: "0644"
    backup: true
  notify: Restart torrserver
  tags:
    - daemon_config

- name: config | Show configuration file
  ansible.builtin.slurp:
    src: "{{ torrserver_install_dir }}/{{ torrserver_service_name }}.config"
  register: config_file_content
  tags:
    - debug

- name: config | Display configuration file contents
  ansible.builtin.debug:
    msg: "{{ config_file_content.content | b64decode }}"
  tags:
    - debug

- name: config | Create authentication file
  ansible.builtin.template:
    src: accs.db.j2
    dest: "{{ torrserver_install_dir }}/accs.db"
    owner: "{{ torrserver_user }}"
    group: "{{ torrserver_group }}"
    mode: "0600"
  when: torrserver_enable_auth
  notify: Restart torrserver
  tags:
    - auth

- name: config | Create settings.json file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.template', role_path ~ '/templates/settings.json.j2') | regex_replace('\r?\n$', '') }}"
    dest: "{{ torrserver_install_dir }}/settings.json"
    owner: "{{ torrserver_user }}"
    group: "{{ torrserver_group }}"
    mode: "0644"
    backup: true
  notify: Restart torrserver
  tags:
    - settings

- name: config | Create tg.cfg file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.template', role_path ~ '/templates/tg.cfg.j2') | regex_replace('\r?\n$', '') }}"
    dest: "{{ torrserver_install_dir }}/tg.cfg"
    owner: "{{ torrserver_user }}"
    group: "{{ torrserver_group }}"
    mode: "0600"
    backup: true
  when:
    - torrserver_tg_token is defined
    - torrserver_tg_token is not none
    - (torrserver_tg_token | string | trim) != ''
  notify: Restart torrserver
  tags:
    - telegram
    - tg_config
