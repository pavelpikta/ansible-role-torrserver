---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    - name: Check torrserver service status
      ansible.builtin.command:
        cmd: systemctl is-active {{ torrserver_service_name }}
      register: service_status
      changed_when: false
      failed_when: false

    - name: Assert torrserver service is active
      ansible.builtin.assert:
        that:
          - service_status.rc == 0
          - service_status.stdout == "active"
        fail_msg: "torrserver service is not running (status: {{ service_status.stdout }})"
        success_msg: "torrserver service is running"
