---
torrserver_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: arm7
  armv6l: arm5
  i386: "386"
  i686: "386"

architecture: "{{ torrserver_arch_map[ansible_facts['architecture']] | default('amd64') }}"

torrserver_bittorr_effective_settings: >-
  {{ torrserver_bittorr_settings | default({})
     | combine(torrserver_bittorr_settings_host | default({}), recursive=True) }}

torrserver_tg_effective_config: >-
  {{ torrserver_tg_config | default({})
     | combine(torrserver_tg_config_host | default({}), recursive=True) }}

torrserver_tg_config_key_order:
  - HostTG
  - HostWeb
  - WhiteIds
  - BlackIds
  - Socks5

# Minimum TorrServer MatriX version required for CLI flags and BitTorr settings.
# Versions use MatriX numbering (e.g. 141.10 for MatriX.141.10).
torrserver_feature_versions:
  ssl: "130"
  searchwa: "130"
  max_size: "130"
  ip: "136"
  tg_token: "136"
  fuse_path: "137"
  webdav: "137"
  proxy_url: "137"
  proxy_mode: "137"
  force_https: "141.10"

torrserver_bittorr_feature_versions:
  ResponsiveMode: "136"
  EnableTorznabSearch: "137"
  TorznabUrls: "137"
  ShowFSActiveTorr: "137"
  StoreSettingsInJson: "137"
  StoreViewedInJson: "137"
  TMDBSettings: "138"
  EnableProxy: "138"
  ProxyHosts: "138"
  EnableLPD: "141.10"
  LPDIPv6: "141.10"
  TrackTimecode: "141.10"

# BitTorr settings.json key order used by the TorrServer web UI.
torrserver_bittorr_settings_key_order:
  - CacheSize
  - ConnectionsLimit
  - DisableDHT
  - DisablePEX
  - DisableTCP
  - DisableUPNP
  - DisableUTP
  - DisableUpload
  - DownloadRateLimit
  - EnableDLNA
  - EnableDebug
  - EnableIPv6
  - EnableLPD
  - EnableProxy
  - EnableRutorSearch
  - EnableTorznabSearch
  - ForceEncrypt
  - FriendlyName
  - LPDIPv6
  - PeersListenPort
  - PreloadCache
  - ProxyHosts
  - ReaderReadAHead
  - RemoveCacheOnDrop
  - ResponsiveMode
  - RetrackersMode
  - ShowFSActiveTorr
  - SslCert
  - SslKey
  - SslPort
  - StoreSettingsInJson
  - StoreViewedInJson
  - TMDBSettings
  - TorrentDisconnectTimeout
  - TorrentsSavePath
  - TorznabUrls
  - TrackTimecode
  - UploadRateLimit
  - UseDisk
