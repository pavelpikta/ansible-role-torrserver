---
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    torrserver_service_name: torrserver
  tasks:
    - name: Get torrserver service status
      ansible.builtin.systemd:
        name: "{{ torrserver_service_name }}"
      register: torrserver_status

    - name: Assert torrserver service is running
      ansible.builtin.assert:
        that:
          - torrserver_status.status is defined
          - torrserver_status.status.ActiveState == 'active'
          - torrserver_status.status.SubState == 'running'
        fail_msg: "torrserver service is not active/running (ActiveState: {{ torrserver_status.status.ActiveState | default('unknown') }}, SubState: {{ torrserver_status.status.SubState | default('unknown') }})"
        success_msg: "torrserver service confirmed active and running"
