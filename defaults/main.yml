---
torrserver_version: latest
torrserver_user: torrserver
torrserver_group: torrserver
torrserver_install_dir: /opt/torrserver
torrserver_port: 8090
torrserver_ip: null
torrserver_service_name: torrserver

# Configuration options
torrserver_read_only: false
torrserver_enable_log: false
torrserver_log_path: "{{ torrserver_install_dir }}/{{ torrserver_service_name }}.log"
torrserver_enable_auth: false
torrserver_auth_users:
  torrserver: torrserver

# SSL/TLS options
torrserver_ssl_enable: false
torrserver_ssl_port: 8091
torrserver_ssl_cert_path: null
torrserver_ssl_key_path: null

# Logging options
torrserver_weblog_path: null

# Service behavior options
torrserver_dontkill: false

# Torrent options
torrserver_torrents_dir: null
torrserver_torrent_addr: null

# Network options
torrserver_pubipv4: null
torrserver_pubipv6: null

# Search options
torrserver_searchwa: false

# Stream and integration options
torrserver_max_size: null
torrserver_tg_token: null
torrserver_fuse_path: null

# Telegram bot configuration (tg.cfg)
# Override any of these settings by defining torrserver_tg_config in your playbook
torrserver_tg_config: {}
# Per-host Telegram overrides (merged on top of torrserver_tg_config; use in host_vars)
torrserver_tg_config_host: {}
# Default Telegram bot settings (used as base, merged with torrserver_tg_config)
torrserver_tg_defaults:
  HostTG: "https://api.telegram.org"
  HostWeb: ""
  WhiteIds: []
  BlackIds: []
  Socks5: ""
torrserver_webdav: false
torrserver_ui: false

# Proxy options
torrserver_proxy_url: null
torrserver_proxy_mode: null
torrserver_force_https: false

# Performance
torrserver_enable_bbr: true

# Version handling
# When true, fail if configured options require a newer TorrServer than the effective version.
torrserver_version_strict: false

# Advanced
torrserver_bin_prefix: TorrServer-linux
torrserver_repo_url: https://github.com/YouROK/TorrServer
torrserver_api_url: https://api.github.com/repos/YouROK/TorrServer

# Local installation option
# If set, the role will copy the binary from this local path instead of downloading
# Example: /path/to/TorrServer-linux-amd64
torrserver_local_file: null
torrserver_use_local: "{{ torrserver_local_file is defined and torrserver_local_file is not none and (torrserver_local_file | string | trim) != '' }}"

# BitTorr settings (settings.json)
# Override any of these settings by defining torrserver_bittorr_settings in your playbook
torrserver_bittorr_settings: {}
# Per-host BitTorr overrides (merged on top of torrserver_bittorr_settings; use in host_vars)
torrserver_bittorr_settings_host: {}
# Default BitTorr settings (used as base, merged with torrserver_bittorr_settings)
torrserver_bittorr_defaults:
  CacheSize: 67108864
  ConnectionsLimit: 25
  DisableDHT: false
  DisablePEX: false
  DisableTCP: false
  DisableUPNP: false
  DisableUTP: false
  DisableUpload: false
  DownloadRateLimit: 0
  EnableDLNA: false
  EnableDebug: false
  EnableIPv6: false
  EnableRutorSearch: false
  EnableTorznabSearch: false
  ForceEncrypt: false
  FriendlyName: ""
  PeersListenPort: 0
  PreloadCache: 50
  ReaderReadAHead: 95
  RemoveCacheOnDrop: false
  ResponsiveMode: true
  RetrackersMode: 1
  ShowFSActiveTorr: true
  SslCert: ""
  SslKey: ""
  SslPort: 0
  StoreSettingsInJson: true
  StoreViewedInJson: false
  TorrentDisconnectTimeout: 30
  TorrentsSavePath: ""
  TorznabUrls: null
  UploadRateLimit: 0
  UseDisk: false
  EnableLPD: true
  LPDIPv6: false
  TrackTimecode: false
  EnableProxy: false
  ProxyHosts:
    - "*themoviedb.org"
    - "*tmdb.org"
    - "rutor.info"
  TMDBSettings:
    APIKey: ""
    APIURL: "https://api.themoviedb.org"
    ImageURL: "https://image.tmdb.org"
    ImageURLRu: "https://imagetmdb.com"
