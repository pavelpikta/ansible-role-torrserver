---
torrserver_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: arm7
  armv6l: arm5
  i386: "386"
  i686: "386"

architecture: "{{ torrserver_arch_map[ansible_facts['architecture']] | default('amd64') }}"

# Internal BitTorr defaults merged under torrserver_bittorr_settings / torrserver_bittorr_settings_host.
torrserver_bittorr_defaults:
  CacheSize: 67108864
  ConnectionsLimit: 25
  DisableDHT: false
  DisablePEX: false
  DisableTCP: false
  DisableUPNP: false
  DisableUTP: false
  DisableUpload: false
  DownloadRateLimit: 0
  EnableDLNA: false
  EnableDebug: false
  EnableIPv6: false
  EnableRutorSearch: false
  EnableTorznabSearch: false
  ForceEncrypt: false
  FriendlyName: ""
  PeersListenPort: 0
  PreloadCache: 50
  ReaderReadAHead: 95
  RemoveCacheOnDrop: false
  ResponsiveMode: true
  RetrackersMode: 1
  ShowFSActiveTorr: true
  SslCert: ""
  SslKey: ""
  SslPort: 0
  StoreSettingsInJson: true
  StoreViewedInJson: false
  TorrentDisconnectTimeout: 30
  TorrentsSavePath: ""
  TorznabUrls: null
  UploadRateLimit: 0
  UseDisk: false
  EnableLPD: true
  LPDIPv6: false
  TrackTimecode: false
  EnableProxy: false
  ProxyHosts:
    - "*themoviedb.org"
    - "*tmdb.org"
    - "rutor.info"
  TMDBSettings:
    APIKey: ""
    APIURL: "https://api.themoviedb.org"
    ImageURL: "https://image.tmdb.org"
    ImageURLRu: "https://imagetmdb.com"

torrserver_bittorr_effective_settings: >-
  {{ torrserver_bittorr_settings | default({})
     | combine(torrserver_bittorr_settings_host | default({}), recursive=True) }}

# Minimum TorrServer MatriX version required for CLI flags and BitTorr settings.
# Versions use MatriX numbering (e.g. 141.10 for MatriX.141.10).
torrserver_feature_versions:
  ssl: "130"
  searchwa: "130"
  max_size: "130"
  ip: "136"
  tg_token: "136"
  fuse_path: "137"
  webdav: "137"
  proxy_url: "137"
  proxy_mode: "137"
  force_https: "141.10"
  ip_repeatable: "142.1"

torrserver_bittorr_feature_versions:
  ResponsiveMode: "136"
  EnableTorznabSearch: "137"
  TorznabUrls: "137"
  ShowFSActiveTorr: "137"
  StoreSettingsInJson: "137"
  StoreViewedInJson: "137"
  TMDBSettings: "138"
  EnableProxy: "138"
  ProxyHosts: "138"
  EnableLPD: "142"
  LPDIPv6: "142"
  TrackTimecode: "142"

# BitTorr settings removed in newer TorrServer releases.
torrserver_bittorr_feature_deprecated:
  EnableProxy: "142"
  ProxyHosts: "142"

# BitTorr settings.json key order used by the TorrServer web UI.
torrserver_bittorr_settings_key_order:
  - CacheSize
  - ConnectionsLimit
  - DisableDHT
  - DisablePEX
  - DisableTCP
  - DisableUPNP
  - DisableUTP
  - DisableUpload
  - DownloadRateLimit
  - EnableDLNA
  - EnableDebug
  - EnableIPv6
  - EnableLPD
  - EnableProxy
  - EnableRutorSearch
  - EnableTorznabSearch
  - ForceEncrypt
  - FriendlyName
  - LPDIPv6
  - PeersListenPort
  - PreloadCache
  - ProxyHosts
  - ReaderReadAHead
  - RemoveCacheOnDrop
  - ResponsiveMode
  - RetrackersMode
  - ShowFSActiveTorr
  - SslCert
  - SslKey
  - SslPort
  - StoreSettingsInJson
  - StoreViewedInJson
  - TMDBSettings
  - TorrentDisconnectTimeout
  - TorrentsSavePath
  - TorznabUrls
  - TrackTimecode
  - UploadRateLimit
  - UseDisk
