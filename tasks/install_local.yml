---
- name: install_local | Verify local file exists
  ansible.builtin.stat:
    path: "{{ torrserver_local_file }}"
  register: local_file_stat

- name: install_local | Fail if local file does not exist
  ansible.builtin.fail:
    msg: "Local file '{{ torrserver_local_file }}' does not exist or is not accessible"
  when: not local_file_stat.stat.exists

- name: install_local | Copy torrserver binary from local file
  ansible.builtin.copy:
    src: "{{ torrserver_local_file }}"
    dest: "{{ torrserver_install_dir }}/{{ torrserver_bin_prefix }}-{{ architecture }}"
    mode: "0755"
    owner: "{{ torrserver_user }}"
    group: "{{ torrserver_group }}"
    remote_src: false
  notify: Restart torrserver
