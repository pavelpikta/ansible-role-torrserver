---
torrserver_version: latest
torrserver_user: torrserver
torrserver_group: torrserver
torrserver_install_dir: /opt/torrserver
torrserver_port: 8090
torrserver_service_name: torrserver

# Configuration options
torrserver_read_only: false
torrserver_enable_log: false
torrserver_log_path: "{{ torrserver_install_dir }}/{{ torrserver_service_name }}.log"
torrserver_enable_auth: false
torrserver_auth_users:
  torrserver: torrserver

# SSL/TLS options
torrserver_ssl_enable: false
torrserver_ssl_port: 8091
torrserver_ssl_cert_path: null
torrserver_ssl_key_path: null

# Logging options
torrserver_weblog_path: null

# Service behavior options
torrserver_dontkill: false

# Torrent options
torrserver_torrents_dir: null
torrserver_torrent_addr: null

# Network options
torrserver_pubipv4: null
torrserver_pubipv6: null

# Search options
torrserver_searchwa: false

# Performance
torrserver_enable_bbr: true

# Advanced
torrserver_bin_prefix: TorrServer-linux
torrserver_repo_url: https://github.com/YouROK/TorrServer
torrserver_api_url: https://api.github.com/repos/YouROK/TorrServer

# Local installation option
# If set, the role will copy the binary from this local path instead of downloading
# Example: /path/to/TorrServer-linux-amd64
torrserver_local_file: null

# BitTorr settings (settings.json)
# Override any of these settings by defining torrserver_bittorr_settings in your playbook
torrserver_bittorr_settings: {}
# Default BitTorr settings (used as base, merged with torrserver_bittorr_settings)
torrserver_bittorr_defaults:
  CacheSize: 64
  ConnectionsLimit: 25
  DisableDHT: false
  DisablePEX: false
  DisableTCP: false
  DisableUPNP: false
  DisableUTP: false
  DisableUpload: false
  DownloadRateLimit: 0
  EnableDLNA: false
  EnableDebug: false
  EnableIPv6: false
  EnableRutorSearch: false
  # EnableTorznabSearch: false
  ForceEncrypt: false
  FriendlyName: ""
  PeersListenPort: 0
  PreloadCache: 50
  ReaderReadAHead: 95
  RemoveCacheOnDrop: false
  ResponsiveMode: false
  RetrackersMode: 1
  # ShowFSActiveTorr: false
  SslCert: ""
  SslKey: ""
  SslPort: 0
  TorrentDisconnectTimeout: 30
  TorrentsSavePath: ""
  # TorznabUrls: []
  UploadRateLimit: 0
  UseDisk: false
