---
- name: install | Check installed version
  ansible.builtin.command: "{{ torrserver_install_dir }}/{{ torrserver_bin_prefix }}-{{ architecture }} --version"
  register: installed_version_cmd
  ignore_errors: true
  changed_when: false
  tags:
    - install
    - facts

- name: install | Set installed version fact
  ansible.builtin.set_fact:
    torrserver_installed_tag: "{{ installed_version_cmd.stdout | regex_search('MatriX\\.\\d+(?:\\.\\d+)?') }}"
  when: installed_version_cmd.rc == 0
  tags:
    - install
    - facts

- name: install | Install from local file
  ansible.builtin.include_tasks:
    file: install_local.yml
    apply:
      tags:
        - torrserver
        - install
        - install_local
  tags:
    - torrserver
    - install
    - install_local
  when: torrserver_use_local | default(false) | bool

- name: install | Install from remote repository
  ansible.builtin.include_tasks:
    file: install_remote.yml
    apply:
      tags:
        - torrserver
        - install
        - install_remote
  tags:
    - torrserver
    - install
    - install_remote
  when: not (torrserver_use_local | default(false) | bool)
